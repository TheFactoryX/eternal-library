<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Eternal Library</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #0a0a0a;
            --text: #e0e0e0;
            --muted: #666;
            --accent: #8b7355;
            --glow: rgba(139, 115, 85, 0.3);
        }

        body {
            font-family: 'Georgia', 'Times New Roman', serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            line-height: 1.8;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 60px 20px;
        }

        header {
            text-align: center;
            margin-bottom: 80px;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: normal;
            letter-spacing: 0.2em;
            margin-bottom: 20px;
            color: var(--accent);
        }

        .subtitle {
            color: var(--muted);
            font-style: italic;
            font-size: 1.1rem;
        }

        .status {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-top: 30px;
            color: var(--muted);
            font-size: 0.9rem;
        }

        .pulse {
            width: 8px;
            height: 8px;
            background: var(--accent);
            border-radius: 50%;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.3; box-shadow: 0 0 5px var(--glow); }
            50% { opacity: 1; box-shadow: 0 0 15px var(--glow); }
        }

        .tomes {
            display: flex;
            flex-direction: column;
            gap: 40px;
        }

        .tome {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(139, 115, 85, 0.2);
            padding: 40px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .tome:hover {
            background: rgba(255, 255, 255, 0.04);
            border-color: var(--accent);
            box-shadow: 0 0 30px var(--glow);
        }

        .tome-title {
            font-size: 1.5rem;
            margin-bottom: 15px;
            color: var(--text);
        }

        .tome-synopsis {
            color: var(--muted);
            font-size: 0.95rem;
            margin-bottom: 20px;
        }

        .tome-meta {
            display: flex;
            gap: 30px;
            font-size: 0.85rem;
            color: var(--muted);
            flex-wrap: wrap;
        }

        .tome-meta span {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Reading View */
        .reading-view {
            display: none;
        }

        .reading-view.active {
            display: block;
        }

        .tomes-view.hidden {
            display: none;
        }

        .back-btn {
            color: var(--muted);
            font-size: 0.9rem;
            cursor: pointer;
            margin-bottom: 30px;
            display: inline-block;
            transition: color 0.2s;
        }

        .back-btn:hover {
            color: var(--accent);
        }

        .reading-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .reading-title {
            font-size: 1.8rem;
            color: var(--accent);
            margin-bottom: 10px;
        }

        /* Chapter Navigation */
        .chapter-nav {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-bottom: 40px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 8px;
        }

        .nav-btn {
            background: none;
            border: 1px solid var(--muted);
            color: var(--muted);
            padding: 8px 16px;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.9rem;
            transition: all 0.2s;
            border-radius: 4px;
        }

        .nav-btn:hover:not(:disabled) {
            border-color: var(--accent);
            color: var(--accent);
        }

        .nav-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .chapter-select {
            background: var(--bg);
            border: 1px solid var(--muted);
            color: var(--text);
            padding: 8px 16px;
            font-family: inherit;
            font-size: 0.9rem;
            cursor: pointer;
            border-radius: 4px;
            min-width: 180px;
            text-align: center;
        }

        .chapter-select:focus {
            outline: none;
            border-color: var(--accent);
        }

        .chapter-info {
            color: var(--muted);
            font-size: 0.85rem;
        }

        /* Content Area */
        .content {
            padding: 40px 0;
            border-top: 1px solid rgba(139, 115, 85, 0.2);
        }

        .content-header {
            color: var(--muted);
            font-size: 0.85rem;
            margin-bottom: 30px;
            text-align: center;
        }

        .content-body {
            font-size: 1.1rem;
            line-height: 2;
            text-align: justify;
        }

        .content-body p {
            margin-bottom: 1.5em;
            text-indent: 2em;
        }

        /* Bottom Navigation */
        .bottom-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 60px;
            padding-top: 30px;
            border-top: 1px solid rgba(139, 115, 85, 0.1);
        }

        .bottom-nav .nav-btn {
            min-width: 120px;
        }

        .bottom-nav .current {
            color: var(--muted);
            font-size: 0.9rem;
        }

        .loading {
            text-align: center;
            color: var(--muted);
            padding: 60px;
        }

        footer {
            text-align: center;
            margin-top: 80px;
            padding-top: 40px;
            border-top: 1px solid rgba(139, 115, 85, 0.1);
            color: var(--muted);
            font-size: 0.85rem;
        }

        footer a {
            color: var(--accent);
            text-decoration: none;
        }

        /* Mobile Optimization */
        @media (max-width: 600px) {
            .container {
                padding: 30px 15px;
            }

            h1 {
                font-size: 1.8rem;
                letter-spacing: 0.1em;
            }

            .tome {
                padding: 25px;
            }

            .tome-meta {
                gap: 15px;
            }

            .chapter-nav {
                flex-wrap: wrap;
                gap: 10px;
            }

            .bottom-nav {
                flex-direction: column;
                gap: 15px;
            }

            .content-body {
                font-size: 1rem;
                text-align: left;
            }

            .content-body p {
                text-indent: 0;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>The Eternal Library</h1>
            <p class="subtitle">Books that never end</p>
            <div class="status">
                <span class="pulse"></span>
                <span>The Librarian is writing...</span>
            </div>
        </header>

        <main class="tomes-view" id="tomes-view">
            <div class="tomes" id="tomes-list">
                <div class="loading">Loading tomes...</div>
            </div>
        </main>

        <main class="reading-view" id="reading-view">
            <div class="back-btn" onclick="showTomes()">← Back to shelf</div>
            <div class="reading-header">
                <h2 class="reading-title" id="reading-title"></h2>
                <p class="subtitle" id="reading-synopsis"></p>
            </div>

            <div class="chapter-nav">
                <button class="nav-btn" id="prev-btn" onclick="prevPage()">← Previous</button>
                <select class="chapter-select" id="chapter-select" onchange="selectChapter()"></select>
                <button class="nav-btn" id="next-btn" onclick="nextPage()">Next →</button>
            </div>

            <div class="content" id="content-area">
                <div class="content-header" id="content-header"></div>
                <div class="content-body" id="content-body"></div>
            </div>

            <div class="bottom-nav">
                <button class="nav-btn" id="prev-btn-bottom" onclick="prevPage()">← Previous</button>
                <span class="current" id="current-indicator"></span>
                <button class="nav-btn" id="next-btn-bottom" onclick="nextPage()">Next →</button>
            </div>
        </main>

        <footer>
            <p>Pages grow every hour. It never stops.</p>
            <p style="margin-top: 10px;">
                <a href="https://github.com/TheFactoryX/eternal-library">GitHub</a>
            </p>
        </footer>
    </div>

    <script>
        let library = null;
        let currentTome = null;
        let currentPage = 1;
        let pagesCache = {};

        async function loadLibrary() {
            try {
                const response = await fetch('./library.json?' + Date.now());
                library = await response.json();
                renderTomes();
            } catch (e) {
                document.getElementById('tomes-list').innerHTML =
                    '<div class="loading">The library has not yet opened...</div>';
            }
        }

        function renderTomes() {
            const container = document.getElementById('tomes-list');
            if (!library || !library.tomes || library.tomes.length === 0) {
                container.innerHTML = '<div class="loading">No tomes on the shelf yet...</div>';
                return;
            }

            container.innerHTML = library.tomes.map(tome => `
                <div class="tome" onclick="openTome('${tome.id}')">
                    <h3 class="tome-title">${tome.title}</h3>
                    <p class="tome-synopsis">${tome.synopsis}</p>
                    <div class="tome-meta">
                        <span>📖 ${tome.pages} ${tome.pages === 1 ? 'chapter' : 'chapters'}</span>
                        <span>🌐 ${tome.language === 'zh' ? 'Chinese' : 'English'}</span>
                        <span>🕐 ${formatTime(tome.updated_at)}</span>
                    </div>
                </div>
            `).join('');
        }

        async function openTome(tomeId) {
            currentTome = library.tomes.find(t => t.id === tomeId);
            if (!currentTome) return;

            document.getElementById('tomes-view').classList.add('hidden');
            document.getElementById('reading-view').classList.add('active');

            document.getElementById('reading-title').textContent = currentTome.title;
            document.getElementById('reading-synopsis').textContent = currentTome.synopsis;

            // Build chapter select dropdown
            const select = document.getElementById('chapter-select');
            select.innerHTML = '';
            for (let i = currentTome.pages; i >= 1; i--) {
                const option = document.createElement('option');
                option.value = i;
                const label = getChapterLabel(i);
                option.textContent = i === currentTome.pages ? `${label} (Latest)` : label;
                select.appendChild(option);
            }

            // Load latest chapter by default
            currentPage = currentTome.pages;
            select.value = currentPage;
            await loadPage(tomeId, currentPage);
        }

        function getChapterLabel(num) {
            if (!currentTome) return `Chapter ${num}`;

            // Different labels based on tome
            if (currentTome.id === 'tome_0002') return `Letter ${num}`;
            if (currentTome.id === 'tome_0003') return `Entry ${num}`;
            if (currentTome.id === 'tome_0004') return `Log #${String(num).padStart(3, '0')}`;
            if (currentTome.id === 'tome_0005') return `Postcard #${String(num).padStart(3, '0')}`;
            return `Chapter ${num}`;
        }

        function selectChapter() {
            const select = document.getElementById('chapter-select');
            loadPage(currentTome.id, parseInt(select.value));
        }

        function prevPage() {
            if (currentPage > 1) {
                loadPage(currentTome.id, currentPage - 1);
            }
        }

        function nextPage() {
            if (currentPage < currentTome.pages) {
                loadPage(currentTome.id, currentPage + 1);
            }
        }

        function updateNavButtons() {
            const prevBtn = document.getElementById('prev-btn');
            const nextBtn = document.getElementById('next-btn');
            const prevBtnBottom = document.getElementById('prev-btn-bottom');
            const nextBtnBottom = document.getElementById('next-btn-bottom');
            const indicator = document.getElementById('current-indicator');

            prevBtn.disabled = currentPage <= 1;
            nextBtn.disabled = currentPage >= currentTome.pages;
            prevBtnBottom.disabled = currentPage <= 1;
            nextBtnBottom.disabled = currentPage >= currentTome.pages;

            indicator.textContent = `${currentPage} / ${currentTome.pages}`;

            // Update select
            document.getElementById('chapter-select').value = currentPage;
        }

        async function loadPage(tomeId, pageNum) {
            currentPage = pageNum;
            updateNavButtons();

            const cacheKey = `${tomeId}_${pageNum}`;
            const headerEl = document.getElementById('content-header');
            const bodyEl = document.getElementById('content-body');

            if (pagesCache[cacheKey]) {
                renderPage(pagesCache[cacheKey], pageNum);
                return;
            }

            headerEl.textContent = 'Loading...';
            bodyEl.innerHTML = '';

            try {
                const paddedNum = String(pageNum).padStart(3, '0');
                const response = await fetch(`./stacks/${tomeId}/page_${paddedNum}.md?` + Date.now());
                if (!response.ok) throw new Error('Page not found');

                const content = await response.text();
                pagesCache[cacheKey] = content;
                renderPage(content, pageNum);
            } catch (e) {
                headerEl.textContent = '';
                bodyEl.innerHTML = '<p style="color: var(--muted);">This page has not yet been written...</p>';
            }
        }

        function renderPage(content, pageNum) {
            const headerEl = document.getElementById('content-header');
            const bodyEl = document.getElementById('content-body');

            const lines = content.split('\n');
            let timestamp = '';
            let body = [];
            let inBody = false;

            for (const line of lines) {
                if (line.startsWith('> 书写于') || line.startsWith('> Written at') || line.startsWith('> Received at')) {
                    timestamp = line.replace('> ', '')
                        .replace('书写于 ', 'Written at ')
                        .replace('Received at ', 'Received at ');
                } else if (line === '---') {
                    inBody = true;
                } else if (inBody && line.trim()) {
                    body.push(line);
                }
            }

            headerEl.textContent = timestamp;
            bodyEl.innerHTML = body.map(p => `<p>${p}</p>`).join('');

            // Scroll to top of content
            document.getElementById('content-area').scrollIntoView({ behavior: 'smooth' });
        }

        function showTomes() {
            document.getElementById('reading-view').classList.remove('active');
            document.getElementById('tomes-view').classList.remove('hidden');
            currentTome = null;
            currentPage = 1;
        }

        function formatTime(isoString) {
            if (!isoString) return 'Not yet updated';
            const date = new Date(isoString);
            return date.toLocaleString('en-US', {
                month: 'short',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            if (!currentTome) return;
            if (e.key === 'ArrowLeft') prevPage();
            if (e.key === 'ArrowRight') nextPage();
        });

        // Initialize
        loadLibrary();

        // Auto-refresh every 5 minutes
        setInterval(loadLibrary, 5 * 60 * 1000);
    </script>
</body>
</html>
