name: Corridor Switch

on:
  schedule:
    - cron: '*/15 * * * *'  # 每15分钟，轮回一次
  workflow_dispatch:         # 手动触发

jobs:
  write-pages:
    name: 图书管理员工作
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Corridor 0 (中文书卷)
        env:
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
        run: |
          for i in 1 2 3; do
            python corridor0.py && break || sleep 10
          done

      - name: Run Corridor 1 (English Tome)
        env:
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
        run: |
          for i in 1 2 3; do
            python corridor1.py && break || sleep 10
          done

      - name: Push pages
        run: |
          git config user.name "The Librarian"
          git config user.email "librarian@eternal-library.art"
          git add -A
          git diff --staged --quiet || git commit -m "📖 New pages written"
          git push
